name: Deploy production
# Homologação: a integração Git da Vercel implanta cada push na main como preview (vercel.json).
# Produção: somente quando uma release é publicada no GitHub para uma tag que está na main.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag já publicada a reimplantar (rollback)
        required: true
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    environment: production
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_CLI_VERSION: 62.7.0
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Somente tags que estão na main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global "vercel@${VERCEL_CLI_VERSION}"
      # Variáveis do ambiente Production da Vercel (APP_URL, OIDC_*, SESSION_SECRETS...) entram no build e no runtime.
      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: vercel build --prod --token="$VERCEL_TOKEN"
      - run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
